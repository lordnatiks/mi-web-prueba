    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: #0f0f0f;
            color: #f0f0f0;
        }

        /* ─── HEADER / FOOTER ─────────────────────────────────────── */

        .page-header,
        .page-footer {
            padding: 1.25rem 2.25rem;
            border-top: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-inner,
        .footer-inner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
        }

        /* left block */
        .hf-left {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .hf-left .name {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.15;
            text-transform: uppercase;
        }

        .hf-left .meta {
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            color: #aaa;
            line-height: 1.5;
            text-transform: uppercase;
        }

        /* center block */
        .hf-center {
            font-size: 0.6rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #666;
            text-align: center;
            white-space: nowrap;
        }

        /* right block */
        .hf-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .hf-right .role {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: right;
            line-height: 1.15;
        }

        .hf-right .contact {
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            color: #aaa;
            text-align: right;
            line-height: 1.5;
            text-transform: uppercase;
        }

        .social-icons {
            display: flex;
            gap: 0.45rem;
            margin-top: 0.2rem;
        }

        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border: 1px solid #f0f0f0;
            color: #f0f0f0;
            text-decoration: none;
            font-size: 0.55rem;
            letter-spacing: 0;
            transition: background 0.2s, color 0.2s;
        }

        .social-icons a:hover {
            background: #f0f0f0;
            color: #0f0f0f;
        }

        /* ─── GALLERY WRAPPER ─────────────────────────────────────── */

        .gallery-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 3px 0;
        }

        /* ─── SECTION TYPES ───────────────────────────────────────── */

        /* helper: image fills its slot */
        .gallery-wrapper img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* full-width row */
        .row-full {
            width: 100%;
            aspect-ratio: 16 / 7;
            overflow: hidden;
        }

        /* 2-column rows */
        .row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
        }

        .row-2col .cell {
            aspect-ratio: 16 / 9;
            overflow: hidden;
        }

        /* 4 squares row */
        .row-4sq {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }

        .row-4sq .cell {
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        /* full-width t-shirt row */
        .row-full-tshirt {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        /* 3-column portrait row */
        .row-3col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .row-3col .cell {
            aspect-ratio: 4 / 5;
            overflow: hidden;
        }

        /* 2 large squares row */
        .row-2sq {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
        }

        .row-2sq .cell {
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        /* ─── RESPONSIVE ──────────────────────────────────────────── */

        @media (max-width: 768px) {
            .page-header, .page-footer {
                padding: 1rem 1.25rem;
            }

            .hf-left .name,
            .hf-right .role {
                font-size: 0.75rem;
            }

            .row-4sq {
                grid-template-columns: repeat(2, 1fr);
            }

            .row-3col {
                grid-template-columns: repeat(2, 1fr);
            }

            .row-3col .cell:last-child {
                grid-column: span 2;
            }
        }

        @media (max-width: 480px) {
            .header-inner,
            .footer-inner {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
            }

            .hf-center {
                display: none;
            }

            .row-2col,
            .row-2sq {
                grid-template-columns: 1fr;
            }

            .row-2col .cell,
            .row-2sq .cell {
                aspect-ratio: 16 / 9;
            }

            .row-4sq {
                grid-template-columns: repeat(2, 1fr);
            }

            .row-3col {
                grid-template-columns: 1fr;
            }

            .row-3col .cell:last-child {
                grid-column: span 1;
            }
        }
    </style>
</head>
